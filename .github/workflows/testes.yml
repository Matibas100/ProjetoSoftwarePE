name: Testes da Plataforma ENEM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          # Exclusivo deste serviço descartável, sem relação com produção.
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONUTF8: '1'
      DATABASE_URL: mysql+pymysql://root:ci-disposable-only@127.0.0.1:3306/unused
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Dependências de desenvolvimento
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Chave exclusiva do job
        shell: python
        run: |
          import os, secrets
          key = secrets.token_hex(32)
          print('::add-mask::' + key)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AUTH_SECRET_KEY=' + key + '\n')
      - name: Cobertura backend e migrations no MySQL real
        env:
          RUN_MYSQL_INTEGRATION: '1'
          RUN_MYSQL_MIGRATION_INTEGRATION: '1'
        run: python backend/tests/run_backend_coverage.py
      - name: Cobertura frontend
        run: npm run test:coverage
      - name: Servidor público do frontend
        run: python -m unittest discover -s scripts/tests -v
      - name: Vinte percursos no Chromium
        env:
          RUN_MYSQL_E2E: '1'
        run: npm run test:e2e
      - name: Evidências sintéticas e cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validacao
          if-no-files-found: ignore
          retention-days: 7
          path: |
            coverage-backend.json
            coverage-frontend/coverage-summary.json
            test-results/e2e.json
            test-results/browser/**/*.png
